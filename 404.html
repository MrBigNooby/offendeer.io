<title>Page not found · offendeer</title>

<style>
:root{
  --bg:#050505;--fg:#ece6db;--fg-mid:#a39c90;--fg-low:#69645c;--accent:#a98bff;--on-accent:#0b0716;
  --f-display:"Bodoni Moda","Bodoni 72","Didot",Georgia,serif;
  --f-body:"Geist","Helvetica Neue",Arial,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:var(--bg) radial-gradient(ellipse 50% 40% at 50% 45%,rgba(120,88,255,.13),rgba(5,5,5,0) 70%);color:var(--fg);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
main{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.code{margin:0;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-mid)}
h1{margin:0;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:clamp(56px,13vw,150px);line-height:.92;letter-spacing:-.03em}
h1 span{color:var(--accent)}
p{margin:0;max-width:36ch;color:var(--fg-mid);line-height:1.6}
a{display:inline-flex;align-items:center;gap:12px;margin-top:6px;padding:15px 24px;border-radius:999px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;transition:background .25s}
a:hover{background:var(--fg)}
a:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
</style>
</head>
<body>
<main>
  <p class="code">Error 404</p>
  <h1>Lost in<br>the void<span>.</span></h1>
  <p>This page fell past the event horizon. Head back to the homepage and try again.</p>
  <a href="/">Back to offendeer.com</a>
</main>
</body>
</html>
